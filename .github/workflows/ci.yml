name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUTF8: "1"
  UV_NO_PROGRESS: "1"

jobs:
  python:
    name: Python 3.12
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install locked development environment
        run: uv sync --dev --locked

      - name: Lint Python
        run: uv run ruff check apps/harness_server

      - name: Check the eval set offline
        run: uv run python -c "from apps.harness_server.services.qa_catalog import verify_reference; s = verify_reference()['summary']; assert not s['issues'] and s['control_true_count'] == s['fault_false_count'] == s['pair_count'], s"

      - name: Run tests
        run: uv run pytest

  research-ui:
    name: Research UI
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/research_ui/package-lock.json

      - name: Install and build
        run: |
          npm ci --prefix apps/research_ui
          npm run build --prefix apps/research_ui
